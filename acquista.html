<!DOCTYPE html>
<html class="dark" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Acquista Biglietto - NightPass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet"/>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2a5eff",
                        "background-dark": "#0a0a12",
                        "surface-dark": "#151520",
                        "border-dark": "#232334",
                        "text-secondary-dark": "#a0a0b8",
                    },
                    fontFamily: { "display": ["Be Vietnam Pro", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        .dropdown-content { opacity: 0; visibility: hidden; transform: translateY(10px); transition: all 0.2s ease; }
        .group:hover .dropdown-content { opacity: 1; visibility: visible; transform: translateY(0); }
        .ticket-card { transition: all 0.3s ease; cursor: pointer; border: 2px solid transparent; }
        .ticket-card.selected { border-color: #2a5eff; background-color: rgba(42, 94, 255, 0.1); transform: scale(1.02); }
    </style>
</head>
<body class="bg-white dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased transition-colors duration-300">

    <header class="sticky top-0 z-[100] flex items-center justify-between border-b border-slate-200 dark:border-border-dark bg-white/90 dark:bg-background-dark/95 backdrop-blur-xl px-4 md:px-6 py-4 lg:px-10">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='index.html'" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 dark:bg-surface-dark border border-slate-200 dark:border-border-dark hover:border-primary transition-all">
                <span class="material-symbols-outlined">home</span>
            </button>
            <h2 class="text-lg md:text-xl font-black uppercase tracking-tighter">NightPass</h2>
        </div>
        
        <div class="flex gap-3 items-center">
            <button onclick="toggleTheme()" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 dark:bg-surface-dark border border-slate-200 dark:border-border-dark">
                <span id="theme-icon" class="material-symbols-outlined">dark_mode</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 grid lg:grid-cols-2 gap-12">
        <div class="space-y-8">
            <div class="relative aspect-[4/5] rounded-[3rem] overflow-hidden border border-slate-200 dark:border-border-dark shadow-2xl">
                <img src="foto2.jpeg" alt="Evento" class="w-full h-full object-cover">
                <div class="absolute bottom-0 left-0 right-0 p-8 bg-gradient-to-t from-black via-black/60 to-transparent text-white">
                    <h1 class="text-4xl md:text-5xl font-black uppercase leading-tight">Summer Vibe <br>2026</h1>
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-50 dark:bg-surface-dark p-5 rounded-[2rem] border border-slate-100 dark:border-border-dark text-center">
                    <span class="material-symbols-outlined text-primary">calendar_month</span>
                    <p class="text-[10px] font-bold uppercase opacity-50 mt-1">Data</p>
                    <p class="text-xs font-black uppercase">24 GIU</p>
                </div>
                <div class="bg-slate-50 dark:bg-surface-dark p-5 rounded-[2rem] border border-slate-100 dark:border-border-dark text-center">
                    <span class="material-symbols-outlined text-primary">schedule</span>
                    <p class="text-[10px] font-bold uppercase opacity-50 mt-1">Inizio</p>
                    <p class="text-xs font-black uppercase">22:30</p>
                </div>
                <div class="bg-slate-50 dark:bg-surface-dark p-5 rounded-[2rem] border border-slate-100 dark:border-border-dark text-center">
                    <span class="material-symbols-outlined text-primary">verified_user</span>
                    <p class="text-[10px] font-bold uppercase opacity-50 mt-1">Età</p>
                    <p class="text-xs font-black uppercase">18+</p>
                </div>
            </div>
        </div>

        <div class="lg:sticky lg:top-24 h-fit">
            <div class="bg-slate-50 dark:bg-surface-dark border-2 border-primary/20 rounded-[3rem] p-8 shadow-2xl">
                <h2 class="text-2xl font-black uppercase mb-8 text-center" id="ticket-title">Seleziona Biglietto</h2>

                <div class="space-y-4 mb-8">
                    <div id="ticket-early" onclick="selectTicket('EARLY', 25)" class="ticket-card flex justify-between items-center p-6 bg-white dark:bg-background-dark rounded-3xl border-slate-200 dark:border-border-dark">
                        <div>
                            <p class="font-black uppercase text-sm">Early Bird</p>
                            <p class="text-[10px] text-green-500 font-bold uppercase tracking-widest">Disponibile</p>
                        </div>
                        <span class="text-2xl font-black text-primary">€25.00</span>
                    </div>

                    <div id="ticket-regular" onclick="selectTicket('REGULAR', 35)" class="ticket-card flex justify-between items-center p-6 bg-white dark:bg-background-dark rounded-3xl border-slate-200 dark:border-border-dark">
                        <div>
                            <p class="font-black uppercase text-sm">Regular Pass</p>
                            <p class="text-[10px] opacity-50 font-bold uppercase tracking-widest">Standard</p>
                        </div>
                        <span class="text-2xl font-black text-primary">€35.00</span>
                    </div>
                </div>

                <div class="mb-10 p-6 bg-white dark:bg-background-dark rounded-3xl border border-slate-200 dark:border-border-dark">
                    <p class="text-center text-[10px] font-black uppercase mb-4 opacity-50">Quantità Biglietti</p>
                    <div class="flex items-center justify-between max-w-[180px] mx-auto">
                        <button onclick="updateQty(-1)" class="w-12 h-12 rounded-full border border-slate-200 dark:border-border-dark flex items-center justify-center hover:bg-primary hover:text-white transition-all">
                            <span class="material-symbols-outlined">remove</span>
                        </button>
                        <span id="qty-display" class="text-3xl font-black">1</span>
                        <button onclick="updateQty(1)" class="w-12 h-12 rounded-full border border-slate-200 dark:border-border-dark flex items-center justify-center hover:bg-primary hover:text-white transition-all">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                </div>

                <button id="buy-button" onclick="checkout()" class="w-full flex items-center justify-center gap-3 bg-primary text-white py-6 rounded-2xl font-black uppercase tracking-tighter hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-primary/30">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span id="btn-text">Seleziona un biglietto</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        let selectedType = null;
        let selectedPrice = 0;
        let quantity = 1;

        // USA I TUOI LINK QUI
        const STRIPE_LINKS = {
            EARLY: "https://buy.stripe.com/test_aFa8wR63q0GlcIt22m7AI00", // Link da 25€
            REGULAR: "https://buy.stripe.com/test_aFa8wR63q0GlcIt22m7AI00"        // Link da 35€
        };

        function selectTicket(type, price) {
            selectedType = type;
            selectedPrice = price;
            document.querySelectorAll('.ticket-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`ticket-${type.toLowerCase()}`).classList.add('selected');
            updateUI();
        }

        function updateQty(val) {
            quantity = Math.max(1, Math.min(10, quantity + val)); // Min 1, Max 10
            document.getElementById('qty-display').innerText = quantity;
            updateUI();
        }

        function updateUI() {
            const btn = document.getElementById('buy-button');
            const btnText = document.getElementById('btn-text');
            if (!selectedType) {
                btnText.innerText = "Scegli un biglietto";
                btn.style.opacity = "0.5";
            } else {
                const total = (selectedPrice * quantity).toFixed(2);
                btnText.innerText = `Paga €${total}`;
                btn.style.opacity = "1";
            }
        }

        function checkout() {
            if (!selectedType) {
                alert("Seleziona prima il tipo di biglietto!");
                return;
            }
            // FIX DEFINITIVO PER LA QUANTITÀ:
            const linkBase = STRIPE_LINKS[selectedType];
            window.location.href = `${linkBase}?quantity=${quantity}`;
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>
</html>
